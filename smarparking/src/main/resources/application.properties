# ----------------------------------------
# Hibernate / JPA Settings
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


# ----------------------------------------
# Hikari Connection Pool Settings (For Slow Cloud DBs)
# ----------------------------------------
# Give the database up to 30 seconds to connect before timing out
spring.datasource.hikari.connection-timeout=30000
# Keep idle connections alive longer so it doesn't have to constantly reconnect
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Limit the pool size locally so it doesn't overwhelm the Supabase proxy
spring.datasource.hikari.maximum-pool-size=10



# Show the exact SQL Hibernate is executing
logging.level.org.hibernate.SQL=DEBUG
# Show the parameters being passed to the SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE